[project]
name = "page-flip-recognition"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zachary Burghgraef", email = "burghgraefzachary@gmail.com" }
]
requires-python = "==3.12.15"
dependencies = [
    "albumentations>=2.0.8",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.1",
]

[project.scripts]
page-flip-recognition = "page_flip_recognition:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"


[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[tool.uv]
environments = ["sys_platform == 'linux'"]
